[package]
name = "omath"
version = "3.10.1"
edition = "2024"
rust-version = "1.85"
description = "Rust port of omath: math, projection, collision, navigation, ballistics, HUD and process utilities"
license = "Zlib"
homepage = "https://github.com/orange-cpp/omath"
keywords = ["math", "linear-algebra", "collision", "pathfinding", "projection"]
categories = ["mathematics", "game-development"]

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "upstream"
harness = false

[[example]]
name = "hook_dll"
path = "examples/hook_dll.rs"
crate-type = ["cdylib"]
required-features = ["hooks"]

[features]
lua = ["dep:mlua"]
imgui = ["dep:imgui"]
hooks = ["dep:retour", "dep:libloading", "dep:windows"]

[dependencies]
memchr = "2.7"
mlua = { version = "0.11", optional = true, features = ["lua55", "vendored"] }
imgui = { version = "0.12", optional = true }
libloading = { version = "0.8", optional = true }

[target.'cfg(all(any(target_os = "windows", target_os = "linux"), any(target_arch = "x86", target_arch = "x86_64")))'.dependencies]
retour = { version = "0.4.0-alpha.4", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader"] }
windows = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Direct3D9", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Direct3D_Fxc", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[example]]
name = "kf1_injected"
path = "examples/kf1_injected.rs"
crate-type = ["cdylib"]
required-features = ["hooks", "imgui"]
